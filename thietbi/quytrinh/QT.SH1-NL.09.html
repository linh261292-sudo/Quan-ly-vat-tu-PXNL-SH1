*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{

.bg-wash{ position:absolute; inset:0; z-index:-3; }

.bg-c{ background:linear-gradient(170deg,#f7fafc 0%, #eef4f9 55%, #eef7f1 100%); }
.bg-grid{
  position:absolute; inset:0; z-index:-2;
  background-image:
    linear-gradient(rgba(10,42,74,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(10,42,74,.035) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(120% 100% at 50% 20%, #000 40%, transparent 85%);

.orb{ position:absolute; z-index:-1; border-radius:50%; filter:blur(70px); pointer-events:none; opacity:.5; animation:float1 18s ease-in-out infinite; }
.orb-blue{ background:radial-gradient(circle, rgba(0,131,199,.22), transparent 70%); }
.orb-green{ background:radial-gradient(circle, rgba(0,176,80,.22), transparent 70%); }

@keyframes float1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-20px,22px) scale(1.06);} }

.kicker{ display:flex; width:fit-content; align-items:center; justify-content:center; gap:.5em; font-size:var(--fs-eyebrow); letter-spacing:.14em; text-transform:uppercase; color:var(--green); font-weight:700; margin:0 auto 12px; }
.kicker::before{ content:""; width:24px; height:2px; background:var(--green); display:inline-block; }

h1.h1{ font-size:var(--fs-h1); line-height:1.06; font-weight:700; margin:0 auto 16px; color:var(--navy); text-align:center; }

h3.h3{ font-size:var(--fs-h3); font-weight:650; margin:0 0 8px; color:var(--navy); }
p.lead{ font-size:var(--fs-lead); color:var(--muted); max-width:66ch; line-height:1.55; margin:0 auto 8px; text-align:center; }
p.body, li.body{ font-size:var(--fs-body); color:var(--ink); line-height:1.62; }
.muted{ color:var(--muted); }
.accent-blue{ color:var(--blue); }
.accent-green{ color:var(--green); }

.reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s cubic-bezier(.16,.8,.24,1), transform .7s cubic-bezier(.16,.8,.24,1); }
.reveal.in-view{ opacity:1; transform:translateY(0); }
.r-d1{ transition-delay:.05s; } .r-d2{ transition-delay:.13s; } .r-d3{ transition-delay:.21s; }
.r-d4{ transition-delay:.29s; } .r-d5{ transition-delay:.37s; } .r-d6{ transition-delay:.45s; }

.content-wrap{ max-width:1180px; }
.grid{ display:grid; gap:16px; }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }

.card{ background:var(--card-bg); border:1px solid var(--card-bd); border-radius:16px; padding:20px 22px; box-shadow:0 6px 20px rgba(10,42,74,.05); transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease; }

.card ul{ margin:8px 0 0; padding-left:20px; } .card li{ margin-bottom:6px; }

.tag{ display:inline-block; font-size:var(--fs-small); font-weight:600; letter-spacing:.02em; padding:4px 12px; border-radius:999px; border:1px solid rgba(0,131,199,.35); color:var(--blue); background:rgba(0,131,199,.07); margin:2px 6px 2px 0; }
.tag.green{ border-color:rgba(0,176,80,.4); color:#068a41; background:rgba(0,176,80,.08); }

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
.stat{ background:linear-gradient(160deg, rgba(0,131,199,.08), rgba(0,176,80,.05)); border:1px solid var(--card-bd); border-radius:16px; padding:18px 18px 14px; }
.stat .num{ font-family:'Sora',sans-serif; font-weight:700; font-size:var(--fs-stat); color:var(--navy); line-height:1; }
.stat .num span.unit{ font-size:.4em; color:var(--blue); margin-left:4px; font-weight:600; }
.stat .lbl{ margin-top:8px; font-size:var(--fs-small); color:var(--muted); line-height:1.4; }

.table-card{ background:var(--card-bg); border:1px solid var(--card-bd); border-radius:16px; padding:6px; overflow-x:auto; box-shadow:0 6px 20px rgba(10,42,74,.05); }
table{ width:100%; border-collapse:collapse; font-size:var(--fs-small); min-width:480px; }
thead th{ text-align:left; font-family:'Sora',sans-serif; color:#068a41; font-weight:650; padding:12px 14px; border-bottom:2px solid rgba(0,176,80,.35); white-space:nowrap; }
tbody td{ padding:10px 14px; border-bottom:1px solid #eef2f6; color:var(--ink); vertical-align:top; }
tbody tr:hover{ background:rgba(0,131,199,.05); }
tbody tr:last-child td{ border-bottom:none; }

.steps{ counter-reset:step; list-style:none; margin:0; padding:0; display:grid; gap:12px; }
.steps li{ counter-increment:step; position:relative; padding-left:44px; font-size:var(--fs-body); color:var(--ink); line-height:1.55; }
.steps li::before{ content:counter(step); position:absolute; left:0; top:0; width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--blue),var(--green)); color:#fff; font-weight:700; font-family:'Sora',sans-serif; display:flex; align-items:center; justify-content:center; font-size:.85rem; }

.warn-card{ border-left:3px solid var(--blue); background:rgba(0,131,199,.05); border-radius:0 14px 14px 0; padding:16px 20px; }

.warn-card ul, .ok-card ul{ margin:6px 0 0; padding-left:20px; } .warn-card li, .ok-card li{ margin-bottom:6px; font-size:var(--fs-body); }

.footer-brand{ position:absolute; bottom:clamp(16px,3vh,26px); left:calc(var(--nav-w) + clamp(24px,4vw,60px)); font-size:var(--fs-small); color:var(--muted-2); letter-spacing:.04em; display:flex; gap:10px; align-items:center; }

.pill-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; justify-content:center; }

/* photo card */
.photo-card{ border-radius:16px; overflow:hidden; border:1px solid var(--card-bd); box-shadow:0 10px 26px rgba(10,42,74,.09); background:#fff; }
.photo-card img{ display:block; width:100%; height:100%; object-fit:cover; }

.cover-badge{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border-radius:999px; background:#fff; border:1px solid var(--card-bd); box-shadow:0 6px 18px rgba(10,42,74,.06); font-size:var(--fs-small); color:var(--muted); margin:0 auto 24px; }
.cover-badge b{ color:#068a41; }
.cover-code{ font-family:'Sora',sans-serif; font-size:var(--fs-small); color:var(--muted-2); letter-spacing:.1em; margin:20px auto 0; text-align:center; }
.cover-author{ display:flex; align-items:center; gap:12px; margin:18px auto 0; padding:10px 20px 10px 16px; border:1px solid var(--card-bd); border-radius:999px; background:#fff; box-shadow:0 6px 18px rgba(10,42,74,.06); width:fit-content; }
.cover-author::before{ content:"\2713"; width:30px; height:30px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,var(--blue),var(--green)); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; }
.cover-author-name{ font-family:'Sora',sans-serif; font-weight:700; color:var(--navy); font-size:.92rem; }

<script>
(function(){
var UNLOCK_KEY="sh1-qr-unlock";
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function dec(box,pass){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
 var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(box.salt),iterations:box.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct));return new TextDecoder().decode(pt);}
function recall(){try{var s=sessionStorage.getItem(UNLOCK_KEY);if(s)return s;}catch(e){}try{var o=JSON.parse(localStorage.getItem(UNLOCK_KEY)||"null");if(o&&o.exp>Date.now())return o.p;}catch(e){}return "";}
function remember(p){try{localStorage.setItem(UNLOCK_KEY,JSON.stringify({p:p,exp:Date.now()+12*3600e3}));}catch(e){}}
var BOX=JSON.parse(document.getElementById("payload").textContent);
async function open(p,quiet){try{var h=await dec(BOX,p);document.getElementById("deck").innerHTML=h;document.getElementById("gate").remove();remember(p);initDeck();return true;}catch(e){if(!quiet)document.getElementById("gerr").textContent="Sai mật khẩu. Kiểm tra lại hoặc liên hệ trưởng kíp.";return false;}}
document.getElementById("gform").onsubmit=function(e){e.preventDefault();open(document.getElementById("gpass").value,false);};
var p=recall();if(p)open(p,true);
function initDeck(){
  var slides=Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var navlist=document.getElementById('navlist');var progressBar=document.getElementById('progressBar');var deck=document.getElementById('deck');
  slides.forEach(function(s,i){var label=s.getAttribute('data-nav')||s.id;var group=s.getAttribute('data-group');
    if(group){var g=document.createElement('div');g.className='group-label';g.textContent=group;navlist.appendChild(g);}
    var li=document.createElement('a');li.href='#'+s.id;li.setAttribute('data-target',s.id);
    var n=document.createElement('span');n.className='n';n.textContent=(i+1<10?'0':'')+(i+1);li.appendChild(n);
    var t=document.createElement('span');t.textContent=label;li.appendChild(t);navlist.appendChild(li);});
  var navLinks=Array.prototype.slice.call(navlist.querySelectorAll('a'));
  navLinks.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var target=document.getElementById(a.getAttribute('data-target'));if(target){target.scrollIntoView({behavior:'smooth',block:'start'});}if(window.innerWidth<=860){document.getElementById('sidenav').classList.remove('open');}});});
  function setActive(id){navLinks.forEach(function(a){var on=a.getAttribute('data-target')===id;a.classList.toggle('active',on);if(on&&a.scrollIntoView)a.scrollIntoView({block:'nearest'});});}
  var io=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in-view');});if(entry.intersectionRatio>0.5){setActive(entry.target.id);}}});},{root:deck,threshold:[0.15,0.5,0.75]});
  slides.forEach(function(s){io.observe(s);});
  deck.addEventListener('scroll',function(){var max=deck.scrollHeight-deck.clientHeight;progressBar.style.width=(max>0?(deck.scrollTop/max)*100:0)+'%';});
  var toggle=document.getElementById('navToggle');if(toggle){toggle.addEventListener('click',function(){document.getElementById('sidenav').classList.toggle('open');});}
  if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();}
  setActive(slides[0].id);
}
})();
</script>
